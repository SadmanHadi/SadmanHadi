<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" fill="none">
  <defs>
    <style>
      @keyframes cyberPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(60px, -25px); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-50px, 30px); }
      }
      @keyframes floatOrb3 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(30px, 40px); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-30px); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateY(310px); opacity: 0; }
      }
      @keyframes barGrow {
        0% { width: 0; }
        100% { width: 680px; }
      }
      @keyframes neonBorder {
        0%, 100% { stroke: #0891b2; stroke-opacity: 0.5; }
        33% { stroke: #9146ff; stroke-opacity: 0.9; }
        66% { stroke: #ec4899; stroke-opacity: 0.7; }
      }
      @keyframes badgeBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 20px; fill: #ffffff; letter-spacing: 1.5px; }
      .subtitle { font-family: 'Fira Code', -apple-system, monospace; font-weight: 600; font-size: 11px; fill: #38bdf8; letter-spacing: 1px; }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 10px; fill: #94a3b8; letter-spacing: 1px; text-transform: uppercase; }
      .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 24px; fill: #ffffff; }
      .badge-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 12px; fill: #f8fafc; }
      .badge-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10px; fill: #64748b; }
      .footer-txt { font-family: 'Fira Code', -apple-system, monospace; font-weight: 700; font-size: 10px; fill: #0891b2; letter-spacing: 1px; }

      .orb1 { animation: floatOrb1 9s ease-in-out infinite; }
      .orb2 { animation: floatOrb2 11s ease-in-out infinite; }
      .orb3 { animation: floatOrb3 13s ease-in-out infinite; }
      .scanner { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .progress-fill { animation: barGrow 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .border-glow { animation: neonBorder 6s ease-in-out infinite; }
      .pulse-badge { animation: badgeBounce 3s ease-in-out infinite; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <pattern id="gridPattern" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="25" cy="25" r="0.8" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>

    <clipPath id="panelClip">
      <rect x="0" y="0" width="800" height="280" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="800" height="280" fill="url(#bgGrad)" />

    <!-- Animated Neon Nebula Background -->
    <g filter="url(#glowEffect)">
      <circle class="orb1" cx="120" cy="80" r="95" fill="#0891b2" fill-opacity="0.35" />
      <circle class="orb2" cx="680" cy="190" r="110" fill="#9146ff" fill-opacity="0.32" />
      <circle class="orb3" cx="420" cy="140" r="85" fill="#ec4899" fill-opacity="0.22" />
    </g>

    <!-- Grid lines -->
    <rect x="0" y="0" width="800" height="280" fill="url(#gridPattern)" />

    <!-- Scanner Beam -->
    <rect class="scanner" x="0" y="0" width="800" height="30" fill="url(#scanGrad)" />

    <!-- Header Section -->
    <g transform="translate(30, 24)">
      <!-- Animated Status Dot -->
      <circle cx="6" cy="14" r="5" fill="#10b981" />
      <circle cx="6" cy="14" r="9" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />
      
      <text x="24" y="16" class="title">GITHUB INTELLIGENCE &amp; STATS</text>
      <text x="24" y="32" class="subtitle">LIVE TELEMETRY // SadmanHadi (ScarYPumpkiN)</text>
    </g>

    <!-- Top Right Rank Badge -->
    <g transform="translate(650, 24)">
      <g class="pulse-badge">
        <rect width="118" height="32" rx="16" fill="#0891b2" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="18" cy="16" r="6" fill="#38bdf8" />
        <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12px" fill="#ffffff" letter-spacing="1px">RANK <tspan fill="#facc15">S+</tspan></text>
      </g>
    </g>

    <!-- Row 1: Key Metric Cards -->
    <g transform="translate(30, 75)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="66" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <rect x="0" y="0" width="4" height="66" rx="2" fill="#38bdf8" />
        <text x="18" y="22" class="stat-label">TOTAL COMMITS</text>
        <text x="18" y="52" class="stat-val">280+</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(182, 0)">
        <rect width="170" height="66" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
        <rect x="0" y="0" width="4" height="66" rx="2" fill="#a855f7" />
        <text x="18" y="22" class="stat-label">PRS MERGED</text>
        <text x="18" y="52" class="stat-val">50+</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(364, 0)">
        <rect width="170" height="66" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
        <rect x="0" y="0" width="4" height="66" rx="2" fill="#06b6d4" />
        <text x="18" y="22" class="stat-label">REPOSITORIES</text>
        <text x="18" y="52" class="stat-val">32</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(546, 0)">
        <rect width="194" height="66" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
        <rect x="0" y="0" width="4" height="66" rx="2" fill="#f59e0b" />
        <text x="18" y="22" class="stat-label">ACHIEVEMENTS</text>
        <text x="18" y="52" class="stat-val" fill="#fef08a">4 BADGES</text>
      </g>
    </g>

    <!-- Row 2: Badges / Highlights -->
    <g transform="translate(30, 153)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="58" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
        <circle cx="28" cy="29" r="16" fill="#0891b2" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
        <path d="M 28 19 L 22 30 L 27 30 L 26 39 L 34 27 L 29 27 Z" fill="#38bdf8" />
        <text x="52" y="26" class="badge-title">Quickdraw</text>
        <text x="52" y="42" class="badge-desc">Closed in &lt;5 min</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(182, 0)">
        <rect width="170" height="58" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.3" />
        <circle cx="28" cy="29" r="16" fill="#7c3aed" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" />
        <path d="M 23 23 L 33 23 L 33 27 L 29 31 L 29 36 L 27 36 L 27 31 L 23 27 Z" fill="#c084fc" />
        <text x="52" y="26" class="badge-title">YOLO</text>
        <text x="52" y="42" class="badge-desc">Merged no review</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(364, 0)">
        <rect width="170" height="58" rx="8" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.3" />
        <circle cx="28" cy="29" r="16" fill="#d97706" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1" />
        <path d="M 23 25 C 23 22 25 20 28 20 C 31 20 33 22 33 25 C 33 28 28 36 28 36 C 28 36 23 28 23 25 Z" fill="#fbbf24" />
        <text x="52" y="26" class="badge-title">Pair Extra (Gold)</text>
        <text x="52" y="42" class="badge-desc">48+ Co-authored</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(546, 0)">
        <rect width="194" height="58" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
        <circle cx="28" cy="29" r="16" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
        <path d="M 21 29 C 24 23 32 23 35 29 C 32 35 24 35 21 29 Z" fill="#38bdf8" />
        <circle cx="28" cy="29" r="3" fill="#ffffff" />
        <text x="52" y="26" class="badge-title">Pull Shark (2x)</text>
        <text x="52" y="42" class="badge-desc">48+ PRs Merged</text>
      </g>
    </g>

    <!-- Footer Progress Line -->
    <g transform="translate(30, 235)">
      <text x="0" y="10" class="footer-txt">SYSTEM PRODUCTIVITY SYNC</text>
      <text x="740" y="10" text-anchor="end" class="footer-txt" fill="#10b981">100% ONLINE</text>
      
      <!-- Progress Bar Track -->
      <rect x="0" y="18" width="740" height="5" rx="2.5" fill="#1e293b" />
      <rect class="progress-fill" x="0" y="18" width="740" height="5" rx="2.5" fill="url(#cyanGrad)" />
    </g>

    <!-- Outer Animated Cyber Border -->
    <rect class="border-glow" x="1.5" y="1.5" width="797" height="277" rx="14.5" fill="none" stroke="#0891b2" stroke-width="1.8" />
  </g>
</svg>
